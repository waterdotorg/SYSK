name: Weekly update (download, profile, index)

# Fully automated weekly refresh:
#   1. download new transcripts from the RSS feed
#   2. build Claude Haiku episode profiles for new episodes
#   3. index new episodes into Pinecone: sysk-v2 (new app) and sysk-transcripts (old app)
#   4. commit new transcripts + profiles back to the repo (Streamlit redeploys on push)
#
# Requires repo secrets: PINECONE_API_KEY, ANTHROPIC_API_KEY (workspace-scoped key)

on:
  schedule:
    - cron: "0 8 * * 1"   # Mondays 08:00 UTC (3 am Central)
  workflow_dispatch:
    inputs:
      limit:
        description: "Newest RSS items to check (existing files are skipped)"
        required: false
        default: "25"

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU-only torch keeps this fast)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install requests beautifulsoup4 lxml pinecone sentence-transformers numpy

      - name: Download new transcripts
        run: python sysk_rss_transcript_downloader.py --limit "${{ inputs.limit || '25' }}"

      - name: Build episode profiles for new episodes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python enrich_episodes.py --limit 30

      - name: Index new episodes (v2 and v1)
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: sysk-transcripts
        run: |
          python index_v2.py
          python index_transcripts.py

      - name: Commit new transcripts and profiles
        run: |
          git config user.name "sysk-weekly-bot"
          git config user.email "sysk-weekly-bot@users.noreply.github.com"
          git add transcripts/*.txt enrichment/*.json episode_descriptions.json
          if git diff --cached --quiet; then
            echo "No new episodes this week."
          else
            git commit -m "Weekly update: $(git diff --cached --name-only -- transcripts | wc -l | tr -d ' ') new episode(s)"
            git push
          fi
